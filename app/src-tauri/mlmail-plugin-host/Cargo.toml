[package]
name = "mlmail-plugin-host"
version = "0.1.0"
description = "mlmail domain host for nitra plugins: grant-gated metadata + draft.create with audit."
edition = "2021"
license = "MIT"
publish = false

[dependencies]
plugin-mail = { git = "https://github.com/nitra/tauri-components", branch = "feat/wasm-plugin-m5-draft-audit" }
plugin-permissions = { git = "https://github.com/nitra/tauri-components", branch = "feat/wasm-plugin-m5-draft-audit" }
plugin-runtime = { git = "https://github.com/nitra/tauri-components", branch = "feat/wasm-plugin-m5-draft-audit" }
plugin-a2ui = { git = "https://github.com/nitra/tauri-components", branch = "feat/wasm-plugin-m5-draft-audit" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "query"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
mockito = "1"
tempfile = "3"
