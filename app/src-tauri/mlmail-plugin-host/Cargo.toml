[package]
name = "mlmail-plugin-host"
version = "0.1.0"
description = "mlmail domain host for nitra plugins: grant-gated mail:metadata.read over Gmail."
edition = "2021"
license = "MIT"
publish = false

[dependencies]
plugin-mail = { git = "https://github.com/nitra/tauri-components" }
plugin-permissions = { git = "https://github.com/nitra/tauri-components" }
plugin-runtime = { git = "https://github.com/nitra/tauri-components" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
mockito = "1"
tempfile = "3"
